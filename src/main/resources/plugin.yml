name: SOYSGiftLoft
version: '${project.version}'
main: soys.soysgiftloft.SOYSGiftLoft
author: SOYS
description: 礼品阁 - 满足条件解锁并发放礼包的插件

# 软依赖：缺任意一个插件本插件仍可加载，仅对应功能（MONEY/POINTS 奖励与条件、
# PLACEHOLDER 条件、占位符变量）自动降级不可用，便于单机调试。
# 注意：softdepend 插件在本插件之后加载，故在 PluginEnableEvent 中懒加载挂钩。
softdepend: [Vault, PlayerPoints, PlaceholderAPI]

commands:
  sgiftloft:
    description: 礼品阁主指令
    aliases: [sgift, sgl]
    permission: soysgiftloft.use
    usage: /<command> <list|info|check|claim|reload|give|reset> [参数]

permissions:
  soysgiftloft.use:
    description: 使用礼品阁玩家指令（list / info / check / claim）
    default: true
  soysgiftloft.admin:
    description: 礼品阁管理员总权限
    default: op
  soysgiftloft.admin.reload:
    description: 重载配置文件
    default: op
  soysgiftloft.admin.give:
    description: 强制把礼包发放给玩家
    default: op
  soysgiftloft.admin.reset:
    description: 重置玩家某礼包的领取状态
    default: op
  soysgiftloft.admin.migrate:
    description: 手动触发存储后端间数据迁移
    default: op
