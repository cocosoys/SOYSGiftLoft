# ============ SOYSGiftLoft 中文语言包 ============
# 统一平铺点路径键，所有键以 soysoygiftloft. 前缀开头（插件名小写）。
# 占位符用 {0} {1} ...（按调用顺序替换）。
# 颜色码使用 & 符号，由插件自动转换为 §。
# 语言文件存放在 插件配置目录/language/ 文件夹下，文件名即语言代码（zh_cn / en_us）。
# 如需自定义，请编辑 服务器目录/plugins/SOYSGiftLoft/language/zh_cn.yml，重启或 reload 生效。

# ---------- 通用 ----------
soysgiftloft.general.no-permission: "&c你没有权限执行该指令。"
