# ---------- 帮助文本（多行用 \n 拼接） ----------
soysgiftloft.help: "&b==== SOYSGiftLoft 指令帮助 ====\n&e/sgiftloft list &7- 查看可领取礼包列表\n&e/sgiftloft info <id> &7- 查看礼包详情\n&e/sgiftloft check <id> &7- 检查礼包解锁状态\n&e/sgiftloft claim <id> &7- 领取礼包\n&e/sgiftloft reload &7- (管理员: soysgiftloft.admin.reload) 重载配置\n&e/sgiftloft give <玩家> <id> &7- (管理员: soysgiftloft.admin.give) 强制发放\n&e/sgiftloft reset <玩家> <id> &7- (管理员: soysgiftloft.admin.reset) 重置领取状态\n&e/sgiftloft migrate <后端> [源后端] &7- (管理员: soysgiftloft.admin.migrate) 迁移数据"
